packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@changesets/cli": 3.0.1
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.0-rc.112
  "@oxlint/plugins": 1.79.0
  "@types/node": 24.13.3
  effect: 4.0.0-rc.112
  oxc-resolver: 11.24.2
  oxfmt: 0.64.0
  oxlint: 1.79.0
  rimraf: 6.1.3
  turbo: 2.10.11
  tsdown: 0.22.14
  typescript: 7.0.2
  vitest: 4.1.11
  "@typescript-eslint/parser": 8.69.0
  eslint: 10.10.0

catalogs:
  eslint:
    typescript: npm:@typescript/typescript6@6.0.2

catalogMode: strict
engineStrict: true
saveExact: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@adamaho/*"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustLockfile: false
