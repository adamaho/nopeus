packages:
  - programs/*
  - packages/*
  - tools/*
  - infra/*

allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

catalog:
  "@changesets/cli": 3.0.3
  "@effect/tsgo": 0.53.0
  "@effect/vitest": 4.0.5
  "@oxlint/plugins": 1.88.0
  "@types/node": 24.19.2
  effect: 4.0.5
  minimatch: 10.2.6
  oxc-resolver: 11.24.2
  oxfmt: 0.73.0
  oxlint: 1.88.0
  rimraf: 6.1.3
  turbo: 2.11.8
  tsdown: 0.23.1
  typescript: 7.0.2
  vitest: 5.0.4

catalogMode: strict

saveExact: true
engineStrict: true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@adamaho/*"
