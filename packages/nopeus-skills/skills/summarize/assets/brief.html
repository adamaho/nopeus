<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><!--{{title}}--></title>
    <!-- Geist loads from the network when it is not installed; system fonts are the fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..700&display=swap"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --panel: #f9fafb;
        --border: #e4e7ec;
        --text: #101828;
        --dim: #667085;
        --add: #067647;
        --del: #b42318;
        --add-bg: #ecfdf3;
        --del-bg: #fef3f2;
        --warn: #b54708;
        --warn-bg: #fffaeb;
        --accent: #175cd3;
        --sans: "Geist", "Geist Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c111d;
          --panel: #161b26;
          --border: #333741;
          --text: #f5f5f6;
          --dim: #94969c;
          --add: #47cd89;
          --del: #f97066;
          --add-bg: #0b2a1c;
          --del-bg: #32110e;
          --warn: #fdb022;
          --warn-bg: #2e1f05;
          --accent: #84caff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--sans);
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }
      header {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }
      section {
        margin-top: 32px;
      }
      h2 {
        margin: 0 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
        font-size: 18px;
      }
      h3 {
        margin: 20px 0 8px;
        color: var(--dim);
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      ul {
        margin: 0;
        padding-left: 20px;
      }
      li + li {
        margin-top: 4px;
      }
      code,
      pre,
      .tree {
        font-family: var(--mono);
        font-size: 13px;
      }
      code {
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--panel);
        border: 1px solid var(--border);
      }
      .dim,
      .ran,
      .none {
        color: var(--dim);
      }
      .ran {
        margin: 8px 0;
        font-size: 13px;
      }
      .add {
        color: var(--add);
      }
      .del {
        color: var(--del);
      }

      .totals {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .total {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }
      .total-label {
        color: var(--dim);
        font-size: 13px;
      }
      .total-added {
        color: var(--add);
        font: 600 28px/1.2 var(--mono);
      }
      .total-meta {
        color: var(--dim);
        font-size: 13px;
      }

      .tree {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow-x: auto;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 20px 20px 64px 64px;
        gap: 8px;
        align-items: baseline;
        line-height: 1.6;
      }
      .row:hover {
        background: var(--border);
      }
      .row-component {
        grid-template-columns: minmax(200px, auto) 20px minmax(0, 1fr);
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: pre;
      }
      .branch {
        color: var(--dim);
      }
      .dir {
        font-weight: 600;
      }
      .row .add,
      .row .del {
        text-align: right;
      }
      .st {
        font-weight: 700;
        text-align: center;
      }
      .st-A {
        color: var(--add);
      }
      .st-M,
      .st-R,
      .st-C {
        color: var(--warn);
      }
      .st-D {
        color: var(--del);
      }
      .bucket {
        color: var(--dim);
        font-size: 11px;
        text-align: center;
      }
      .bucket-production {
        color: var(--accent);
      }
      .owns {
        color: var(--dim);
        font-family: var(--sans);
      }

      .excerpt {
        margin-top: 16px;
      }
      .excerpt-note {
        margin: 4px 0 8px;
      }
      .code {
        margin: 0;
        padding: 8px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow-x: auto;
      }
      .diff-rich {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        --diffs-font-family: var(--mono);
        --diffs-font-size: 13px;
      }
      .ln {
        display: block;
        padding: 0 12px;
        white-space: pre;
      }
      .sign {
        display: inline-block;
        width: 16px;
        user-select: none;
      }
      .ln-plus {
        background: var(--add-bg);
        color: var(--add);
      }
      .ln-minus {
        background: var(--del-bg);
        color: var(--del);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-size: 13px;
        font-weight: 600;
      }
      .chip {
        display: inline-block;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .chip-pass,
      .chip-added,
      .chip-modified,
      .chip-existing {
        background: var(--add-bg);
        color: var(--add);
      }
      .chip-fail,
      .chip-gap {
        background: var(--del-bg);
        color: var(--del);
      }
      .chip-not-run,
      .chip-manual,
      .chip-unrelated {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .shots {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
      }
      figure img {
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      figcaption {
        margin-top: 4px;
        color: var(--dim);
        font-size: 13px;
      }

      .graph {
        position: relative;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      .graph svg {
        display: block;
        width: 100%;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .graph svg.dragging {
        cursor: grabbing;
      }
      .graph-tools {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      .graph-tools button {
        min-width: 28px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: 13px var(--sans);
        cursor: pointer;
      }
      .edge {
        fill: none;
        stroke: var(--dim);
        stroke-width: 1.5;
      }
      .arrowhead {
        fill: var(--dim);
      }
      .node-id {
        fill: #101828;
        font: 700 13px var(--mono);
      }
      .node-title {
        fill: #344054;
        font: 12px var(--sans);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
        color: var(--dim);
        font-size: 13px;
      }
      .swatch {
        display: inline-block;
        width: 12px;
        height: 12px;
        margin-right: 6px;
        border: 1.5px solid;
        border-radius: 3px;
        vertical-align: -1px;
      }
    </style>
  </head>
  <body>
    <main>
      <header><!--{{scope}}--></header>

      <section id="outcome">
        <h2>Outcome</h2>
        <!--{{outcome}}-->
      </section>

      <section id="snapshot">
        <h2>Change snapshot</h2>
        <!--{{snapshot}}-->
      </section>

      <section id="interfaces">
        <h2>Interfaces</h2>
        <!--{{interfaces}}-->
      </section>

      <section id="tests">
        <h2>Test coverage</h2>
        <!--{{tests}}-->
      </section>

      <section id="validation">
        <h2>Validation</h2>
        <!--{{validation}}-->
      </section>

      <section id="attention">
        <h2>Needs attention</h2>
        <!--{{attention}}-->
      </section>

      <!--{{graph}}-->
    </main>
    <script type="module">
      // Upgrades each excerpt to a syntax-highlighted diff with @pierre/diffs,
      // loaded from a CDN. The plain coloured excerpt already on the page stays
      // when the library cannot load, so the brief still reads offline.
      const excerpts = [...document.querySelectorAll(".diff[data-patch]")];
      if (excerpts.length > 0) {
        try {
          const { FileDiff, getSingularPatch } = await import("https://esm.sh/@pierre/diffs@1.7.2");
          for (const excerpt of excerpts) {
            const mount = document.createElement("div");
            mount.className = "diff-rich";
            try {
              new FileDiff({
                diffStyle: "unified",
                disableFileHeader: true,
                diffIndicators: "classic",
                hunkSeparators: "simple",
                overflow: "scroll",
                theme: { dark: "pierre-dark", light: "pierre-light" },
                themeType: "system",
              }).render({ fileDiff: getSingularPatch(excerpt.dataset.patch), containerWrapper: mount });
              excerpt.replaceChildren(mount);
            } catch (error) {
              console.warn("brief: kept the plain excerpt", error);
            }
          }
        } catch (error) {
          console.warn("brief: syntax highlighting unavailable", error);
        }
      }
    </script>
    <script>
      // Pan and zoom for the task graph: drag to pan, scroll or pinch to zoom.
      // The chart is SVG, so it stays sharp at any zoom and needs no library.
      for (const svg of document.querySelectorAll(".graph svg")) {
        const full = svg.viewBox.baseVal;
        const home = { x: full.x, y: full.y, width: full.width, height: full.height };
        const view = { ...home };
        const apply = () => svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);
        const zoom = (factor, clientX, clientY) => {
          const box = svg.getBoundingClientRect();
          const width = Math.min(home.width * 4, Math.max(home.width / 8, view.width * factor));
          const scale = width / view.width;
          const fx = clientX === undefined ? 0.5 : (clientX - box.left) / box.width;
          const fy = clientY === undefined ? 0.5 : (clientY - box.top) / box.height;
          view.x += view.width * fx * (1 - scale);
          view.y += view.height * fy * (1 - scale);
          view.width = width;
          view.height *= scale;
          apply();
        };

        svg.addEventListener(
          "wheel",
          (event) => {
            event.preventDefault();
            zoom(event.deltaY > 0 ? 1.1 : 1 / 1.1, event.clientX, event.clientY);
          },
          { passive: false },
        );

        let drag;
        svg.addEventListener("pointerdown", (event) => {
          drag = { x: event.clientX, y: event.clientY };
          svg.setPointerCapture(event.pointerId);
          svg.classList.add("dragging");
        });
        svg.addEventListener("pointermove", (event) => {
          if (!drag) return;
          const box = svg.getBoundingClientRect();
          view.x -= ((event.clientX - drag.x) * view.width) / box.width;
          view.y -= ((event.clientY - drag.y) * view.height) / box.height;
          drag = { x: event.clientX, y: event.clientY };
          apply();
        });
        const release = () => {
          drag = undefined;
          svg.classList.remove("dragging");
        };
        svg.addEventListener("pointerup", release);
        svg.addEventListener("pointercancel", release);

        const tools = svg.parentElement.querySelector(".graph-tools");
        tools.querySelector("[data-zoom=in]").addEventListener("click", () => zoom(1 / 1.3));
        tools.querySelector("[data-zoom=out]").addEventListener("click", () => zoom(1.3));
        tools.querySelector("[data-zoom=fit]").addEventListener("click", () => {
          Object.assign(view, home);
          apply();
        });
      }
    </script>
  </body>
</html>
